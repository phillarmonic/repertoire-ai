name: Build and Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  GOSEC_VERSION: v2.30.0
  GOVULNCHECK_VERSION: v1.9.0

jobs:
  release:
    name: Verify and build release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Set up xdrun
        uses: phillarmonic/setup-drun@v2
        with:
          version: "v2"

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-only: true

      - name: Restore security scanners
        id: security-tools-cache
        uses: actions/cache@v6
        with:
          path: ~/go/bin
          key: security-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod') }}-${{ env.GOSEC_VERSION }}-${{ env.GOVULNCHECK_VERSION }}

      - name: Install security scanners
        if: steps.security-tools-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@${GOSEC_VERSION}
          go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}

      - name: Add Go tools to PATH
        shell: bash
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install GnuPG
        shell: bash
        run: bash ./scripts/ci-install-gpg.sh

      # ci builds the docs, and the docs task requires uv.
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Run CI
        run: xdrun ci

      - name: Build Unix release binaries
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}
        run: ./scripts/build-release.sh "$VERSION"

      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Build Windows binaries and installer
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}
        run: xdrun installer version="$VERSION"

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          rm -f checksums.txt
          sha256sum repertoire-* > checksums.txt

      - name: Upload dry-run artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: repertoire-release-${{ github.sha }}
          path: |
            dist/repertoire-*
            dist/checksums.txt
          if-no-files-found: error

      # A notes file for the tag is used when one exists, because the generated
      # notes list pull request titles and say nothing about what the release
      # changes for someone installing it. The release is also written in place:
      # publishing over an existing release appends a second copy of the notes
      # instead of replacing them, which is how v1.12.0 came to carry the same
      # block twice.
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          notes="release-notes/${tag}.md"
          assets=(dist/repertoire-* dist/checksums.txt)
          # flags starts with --title so the array is never empty: an empty
          # array under set -u fails on the bash macOS still ships.
          flags=(--title "$tag")

          if [[ "$tag" == *-* ]]; then
            flags+=(--prerelease)
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
            if [[ -f "$notes" ]]; then
              gh release edit "$tag" "${flags[@]}" --notes-file "$notes"
            fi
          elif [[ -f "$notes" ]]; then
            gh release create "$tag" "${assets[@]}" "${flags[@]}" --notes-file "$notes" --verify-tag
          else
            gh release create "$tag" "${assets[@]}" "${flags[@]}" --generate-notes --verify-tag
          fi
